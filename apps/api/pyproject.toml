[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "family-health-llm-api"
version = "0.1.0"
description = "Privacy-conscious family health record MVP API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx>=0.28.1,<0.29.0",
  "pydantic==2.13.5",
  "python-multipart>=0.0.22,<0.1.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<0.29.0",
  "pytest>=9.0.2,<10.0.0",
  "pytest-asyncio>=1.3.0,<2.0.0",
  "ruff>=0.15.0,<0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/family_health_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
