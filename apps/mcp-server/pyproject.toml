[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "family-health-llm-mcp"
version = "0.1.0"
description = "Local stdio MCP tools for the Family Health LLM development API"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1,<0.29.0",
  "mcp==2.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.2,<10.0.0",
  "ruff>=0.15.0,<0.16.0",
]

[project.scripts]
family-health-llm-mcp = "family_health_llm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/family_health_llm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
